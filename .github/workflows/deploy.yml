name: Implantar no Servidor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Implantar via SSH com PM2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DATABASE_URL,JWT_SECRET
          script: |
            set -e
            if [ ! -d /data/GuNaBackend/.git ]; then
              git clone https://github.com/EzioPP/GuNaBackend.git /data/GuNaBackend
            fi
            cd /data/GuNaBackend
            git pull origin main
            export NVM_DIR="$HOME/.nvm"
            if [ -s "$NVM_DIR/nvm.sh" ]; then
              . "$NVM_DIR/nvm.sh"
            else
              echo "nvm not found at $NVM_DIR"
              exit 1
            fi
            nvm install 24
            nvm use 24
            npm ci
            npm run build
            if pm2 describe gunabackend >/dev/null; then
              pm2 restart ecosystem.config.js --update-env
            else
              pm2 start ecosystem.config.js --env production
            fi
            pm2 save
