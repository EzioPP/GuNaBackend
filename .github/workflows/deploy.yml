name: Implantar no Servidor

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Implantar via SSH com PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            if [ ! -d /data/GuNaBackend/.git ]; then
              git clone https://github.com/EzioPP/GuNaBackend.git /data/GuNaBackend
            fi
            cd /data/GuNaBackend
            git pull origin main
            npm ci
            npm run build
            if pm2 describe gunabackend >/dev/null; then
              pm2 restart gunabackend
            else
              pm2 start npm --name gunabackend -- run start
            fi
            pm2 save
